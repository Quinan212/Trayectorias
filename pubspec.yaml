name: correlativas_historia
description: "Trayectorias"
publish_to: "none"
version: 1.3.071026+775
environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  url_launcher: ^6.3.2
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  supabase_flutter: ^2.15.4
  video_player: ^2.11.1
  video_player_win: ^3.2.2
  crop_your_image: ^2.0.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  crypto: ^3.0.5
  archive: ^4.0.9
  xml: ^7.0.1
  http: ^1.6.0
  path_provider: ^2.1.6
  share_plus: ^13.1.0
  webview_flutter: 4.14.1
  webview_flutter_android: 4.13.0
  open_filex: ^4.7.0
  pdfx:
    path: third_party/pdfx
  skeletonizer: ^2.1.3
  # firebase_performance: ^0.11.4+3 # Deshabilitado temporalmente - usa plugin KGP incompatible

dev_dependencies:
  flutter_test:
    sdk: flutter
  webview_flutter_platform_interface: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.18.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon_fore.png
  adaptive_icon_foreground: assets/icon_fore.png
  adaptive_icon_background: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/Artes_visuales.html
    - assets/Biologia.html
    - assets/Comunicacion_social.html
    - assets/contador_publico.html
    - assets/Filosofia.html
    - assets/Fisica.html
    - assets/geografia.html
    - assets/historia.html
    - assets/Lengua_Literatura.html
    - assets/Musica.html
    - assets/politica.html
    - assets/Psicologia.html
    - assets/data/
    - assets/logo.png
    - assets/icon_fore.png
    - assets/career_icons/
    - assets/sage_banner.png
    - assets/sage_wordmark_react.png
    - assets/examenes_llamado1.json
    - assets/examenes_llamado2.json
    - assets/coloquios_feb_mar_2026.json
    - assets/examenes_mayo_2026.json
    - assets/coloquios_mayo_2026.json
    - assets/examenes_julio_llamado1.json
    - assets/examenes_julio_llamado2.json
    - assets/coloquios_julio_2026.json
    - assets/banners/historia/1/pedagogia_ancho.png
    - assets/banners/historia/2/didactica_ciencias_sociales_ancho.png
    - assets/banners/historia/3/procesos_argentina_i.png
    - assets/banners/historia/recorrido/
    - shorebird.yaml

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_24pt-Regular.ttf
          weight: 400
msix_config:
  display_name: Trayectorias
  publisher_display_name: Alan Gabriel Maillet
  publisher: CN=4C9B0D11-F4BA-4831-B28A-BCFADF9CF965
  identity_name: AlanGabrielMaillet.Correlativas
  msix_version: 1.3.55.0
  logo_path: assets/icon_fore.png
  capabilities: internetClient
  store: false
  output_name: Trayectorias_Local_Build
  install_certificate: true
  executable_name: correlativas_historia.exe
